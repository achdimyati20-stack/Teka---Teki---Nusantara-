name: Build Teka-Teki Nusantara APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Prepare web assets
        run: |
          mkdir -p src/main/assets
          cp index.html app.js app_logo.png ahmad-dimyati.jpg clue.mp4 musik-detektif-nusantara.wav src/main/assets/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -n "$(find . -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit)"
          find . -path '*/build/outputs/apk/debug/*.apk' -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teka-Teki-Nusantara-APK-v17
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
