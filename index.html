<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teka-Teki Nusantara</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Arial,sans-serif;color:#fff;background:radial-gradient(circle at top,#185437,#06130d 65%)}
main{max-width:900px;margin:auto;padding:18px}.card{margin:3vh auto;background:#0d2419ee;border:1px solid #f4c54a33;border-radius:26px;padding:28px;box-shadow:0 25px 80px #0008}.center{text-align:center}.hidden{display:none}.logo{width:96px;height:96px;margin:auto;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd76a,#b47716);color:#112016;font-size:40px;font-weight:900}.eyebrow{color:#ffd76a;font-size:12px;letter-spacing:3px;font-weight:800}.title{font-size:clamp(38px,8vw,68px);line-height:.95;margin:15px 0}.sub{color:#b9cbc1}.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:900;background:linear-gradient(135deg,#ffd76a,#d99d28);color:#111;cursor:pointer}.btn.secondary{background:#ffffff12;color:white;border:1px solid #ffffff22}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.input{width:min(480px,100%);padding:14px;border-radius:14px;border:1px solid #ffffff22;background:#06110b;color:#fff;outline:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#43d58f,#ffd76a);transition:.25s}.badge{display:inline-block;color:#ffd76a;border:1px solid #ffd76a55;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:800}.question{font-size:clamp(24px,5vw,40px);line-height:1.2;font-weight:850;text-align:center;margin:25px auto}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:720px;margin:auto}.ans{padding:17px;border-radius:15px;background:#ffffff0c;border:1px solid #ffffff1c;color:#fff;text-align:left;cursor:pointer}.ans.correct{background:#18583a;border-color:#43d58f}.ans.wrong{background:#5a2929;border-color:#ff7474}.feedback{text-align:center;min-height:28px;margin:18px;color:#d7e5dc;font-weight:700}.score{font-size:56px;font-weight:950;color:#ffd76a}@media(max-width:600px){.card{padding:20px}.answers{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section id="home" class="card center"><div class="logo">✦</div><p class="eyebrow">PERMAINAN EDUKASI</p><h1 class="title">TEKA-TEKI<br><span style="color:#ffd76a">NUSANTARA</span></h1><p class="sub">Uji pengetahuanmu tentang budaya, tempat, makanan, seni, dan tradisi Indonesia.</p><div class="row"><button class="btn" onclick="go('name')">MULAI MAIN</button></div></section>
<section id="name" class="card center hidden"><p class="eyebrow">PEMAIN</p><h2>Masukkan nama kamu</h2><p class="sub">Nama akan muncul di hasil akhir.</p><div class="row"><input id="nameInput" class="input" maxlength="24" placeholder="Contoh: Achmad"><button class="btn" onclick="start()">LANJUT</button></div></section>
<section id="game" class="card hidden"><div class="top"><div><b id="hello"></b><div class="sub" id="scoreText"></div></div><span class="badge" id="level"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="question" id="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="row"><button id="next" class="btn hidden" onclick="next()">LANJUT</button></div></section>
<section id="result" class="card center hidden"><p class="eyebrow">SELESAI</p><h2 id="resultTitle"></h2><div id="finalScore" class="score"></div><p id="finalText" class="sub"></p><div class="row"><button class="btn" onclick="restart()">MAIN LAGI</button><button class="btn secondary" onclick="go('home')">BERANDA</button></div></section>
<script>
const Q=[
['Rumah adat Tongkonan berasal dari ...',['Sulawesi Selatan','Sumatera Barat','Bali','Papua'],0],
['Tari Kecak terkenal berasal dari ...',['Bali','Aceh','Jawa Barat','Maluku'],0],
['Rendang merupakan makanan khas yang sangat dikenal dari ...',['Sumatera Barat','Jawa Tengah','Kalimantan Selatan','Banten'],0],
['Candi Borobudur berada di provinsi ...',['Jawa Tengah','Jawa Timur','Jawa Barat','Bali'],0],
['Sasando adalah alat musik tradisional dari ...',['Nusa Tenggara Timur','Riau','Bengkulu','Sulawesi Tengah'],0],
['Angklung sangat identik dengan budaya ...',['Jawa Barat','Papua','Maluku','Sumatera Utara'],0],
['Rumah Gadang adalah rumah adat masyarakat ...',['Minangkabau','Dayak','Bugis','Batak'],0],
['Danau Toba terletak di ...',['Sumatera Utara','Jambi','Lampung','Sumatera Selatan'],0],
['Tari Saman berasal dari ...',['Aceh','Bali','NTB','Jawa Timur'],0],
['Semboyan nasional Indonesia adalah ...',['Bhinneka Tunggal Ika','Tut Wuri Handayani','Merdeka Belajar','Ing Ngarsa Sung Tuladha'],0]
];
let i=0,score=0,answered=false,name='';
const $=id=>document.getElementById(id);function go(id){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden')}
function start(){name=$('nameInput').value.trim();if(!name)return $('nameInput').focus();i=0;score=0;go('game');render()}
function render(){let q=Q[i];answered=false;$('hello').textContent='Halo, '+name+' 👋';$('scoreText').textContent='Skor: '+score;$('level').textContent='LEVEL '+String(i+1).padStart(2,'0');$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');$('bar').style.width=(i/Q.length*100)+'%';$('answers').innerHTML='';q[1].forEach((a,n)=>{let b=document.createElement('button');b.className='ans';b.textContent=a;b.onclick=()=>answer(n,b);$('answers').appendChild(b)})}
function answer(n,b){if(answered)return;answered=true;let q=Q[i];document.querySelectorAll('.ans').forEach((x,k)=>{x.disabled=true;if(k===q[2])x.classList.add('correct')});if(n===q[2]){score+=100;$('feedback').textContent='✓ Jawaban benar! +100 poin';b.classList.add('correct')}else{$('feedback').textContent='✕ Belum tepat. Jawaban: '+q[1][q[2]];b.classList.add('wrong')} $('scoreText').textContent='Skor: '+score;$('next').classList.remove('hidden')}
function next(){if(i<Q.length-1){i++;render()}else finish()}
function finish(){go('result');$('resultTitle').textContent='Hebat, '+name+'!';$('finalScore').textContent=score+' POIN';$('finalText').textContent=score===1000?'Sempurna! Pengetahuan Nusantara kamu luar biasa.':score>=700?'Keren! Kamu punya pengetahuan Nusantara yang kuat.':score>=400?'Bagus! Terus kenali budaya Indonesia.':'Awal yang bagus—ayo belajar lebih banyak tentang Nusantara!'}
function restart(){$('nameInput').value='';go('name')}
</script></main></body></html>
