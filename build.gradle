plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahmaddimyati.tekatakinusantara'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmaddimyati.tekatakinusantara'
        minSdk 23
        targetSdk 35
        versionCode 17
        versionName '17.0'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = []
            assets.srcDirs = ['src/main/assets']
        }
    }
}
